<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Mật Lệnh Hào Khí</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700;800&display=swap">
<style>
/* Bố cục: sân khấu 16:9 hai cột (hồ sơ nhiệm vụ bên trái, khu thao tác bên phải), xếp một cột trên điện thoại. Nền sáng như tường phòng trưng bày. */
:root{
  --paper:#F2F4EE;
  --paper-2:#E6EBE0;
  --surface:#FBFCF8;
  --ink:#1F2B27;
  --ink-2:#4A5954;
  --line:#C9D1C5;
  --bronze:#8C5A1C;
  --bronze-soft:#C7A36A;
  --bronze-wash:#F1E6D0;
  --good:#1F6E4A;
  --good-wash:#DCEEE3;
  --bad:#A62F27;
  --bad-wash:#F6DDD9;
  --warn:#8F5B00;
  --warn-wash:#F6E8C8;
  --motif:#B7C2B1;
  --display:"Noto Serif","Source Serif 4",Georgia,"Times New Roman",serif;
  --body:"Be Vietnam Pro","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding-block:10px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--paper)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--bronze);outline-offset:2px}
.shell{max-width:1240px;margin:0 auto;position:relative;isolation:isolate;display:flex;flex-direction:column;gap:18px}
.wm-wrap{position:absolute;inset:0;overflow:hidden;z-index:-1;pointer-events:none}
.wm{position:absolute;right:-70px;top:90px;width:min(62vw,560px);opacity:.075;color:var(--bronze)}
.drum circle,.drum polygon,.drum path{fill:none;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
.drum polygon{fill:currentColor;fill-opacity:.16}
.band{display:block;width:100%;height:12px}
.zig{stroke:var(--motif);fill:none;stroke-width:1.6}
.kicker{font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--bronze)}
.lbl{font-size:.78rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.hint{font-size:.9rem;color:var(--ink-2)}
.placard{background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:inset 0 0 0 5px var(--surface),inset 0 0 0 6px var(--line),0 14px 30px -22px rgba(31,43,39,.35)}

/* nút */
.btn{min-height:46px;padding:10px 20px;border-radius:4px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);font-weight:600;cursor:pointer;transition:background .12s,transform .12s}
.btn:hover{background:#31423c}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--paper-2)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.danger{border-color:var(--bad);background:var(--bad);color:#fff}

/* thanh trên */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:8px 0 12px;display:grid;gap:10px}
.tb-row{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0;color:var(--bronze)}
.brand-name{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.95rem;color:var(--ink)}
.tb-right{display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.team{font-weight:600;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.score b{font-family:var(--display);font-size:1.35rem;color:var(--ink)}
.timer{display:grid;grid-template-columns:auto auto;align-items:baseline;column-gap:6px;min-width:96px}
.timer #tnum{font-family:var(--display);font-weight:800;font-size:1.7rem;font-variant-numeric:tabular-nums;line-height:1}
.timer small{color:var(--ink-2)}
.timer .tbar{grid-column:1/-1;display:block;height:5px;margin-top:4px;background:var(--paper-2);border-radius:3px;overflow:hidden}
.timer .tbar b{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform .25s linear}
.timer.low #tnum{color:var(--bad)}
.timer.low .tbar b{background:var(--bad)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.steps li{display:flex;flex-direction:column;gap:4px;min-width:0}
.steps .bar{display:block;height:6px;border-radius:3px;background:var(--paper-2);overflow:hidden}
.steps .bar i{display:block;height:100%;background:var(--bronze);transform:scaleX(0);transform-origin:left;transition:transform .5s}
.steps li.done .bar i{transform:scaleX(1)}
.steps li.now .bar i{transform:scaleX(.4);background:var(--ink)}
.steps .nm{font-size:.78rem;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps li.now .nm{color:var(--ink);font-weight:600}

/* trang đầu */
.home{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:28px;align-items:center;padding-top:10px}
.home h1{font-family:var(--display);font-weight:800;letter-spacing:.05em;line-height:1.08;font-size:clamp(2.1rem,5.4vw,4rem);text-wrap:balance;margin-top:8px}
.lede{max-width:56ch;color:var(--ink-2);font-size:1.08rem;margin-top:14px}
.route{list-style:none;margin:22px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px}
.route li{display:flex;gap:10px;align-items:baseline;border-top:1px solid var(--line);padding-top:8px;min-width:0}
.route b{font-family:var(--display);color:var(--bronze);font-size:1.3rem;min-width:1.3rem}
.join{padding:24px;display:grid;gap:12px}
.join h2{font-family:var(--display);font-size:1.4rem}
.join label{font-weight:600}
.join input[type=text]{width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--ink-2);border-radius:4px;background:#fff;font-size:1.05rem}
.err{color:var(--bad);font-size:.92rem;min-height:1.3em}
.fine{font-size:.85rem;color:var(--ink-2)}

/* màn chơi */
.play{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px;align-items:start}
.dossier{padding:24px;display:grid;gap:12px;position:relative}
.dossier h2{font-family:var(--display);font-size:clamp(1.35rem,2.4vw,1.9rem);line-height:1.2;text-wrap:balance}
.dossier .ins{font-size:1.05rem}
.seal{position:absolute;right:18px;top:16px;width:46px;height:46px;border:2px solid var(--bronze);color:var(--bronze);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:.9rem;letter-spacing:.04em;transform:rotate(-7deg);border-radius:3px}
.right{display:grid;gap:16px;min-width:0}
.work{padding:22px;display:grid;gap:16px;min-width:0}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.card,.slot,.m-item,.opt,.chip{-webkit-user-select:none;user-select:none}

/* thử thách 1 */
.axis{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:.82rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.axis-line{flex:1;height:0;border-top:1.5px solid var(--bronze-soft);position:relative}
.axis-line::after{content:"";position:absolute;right:0;top:-5px;border-left:8px solid var(--bronze-soft);border-top:4.5px solid transparent;border-bottom:4.5px solid transparent}
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.slot{min-height:118px;border:1.5px dashed var(--bronze-soft);border-radius:4px;background:transparent;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;touch-action:none;-webkit-user-drag:none}
.slot .idx{font-family:var(--display);font-weight:700;font-size:1.4rem;color:var(--bronze);line-height:1}
.slot-empty{color:var(--ink-2);font-size:.9rem}
.slot-name{font-weight:600;line-height:1.3}
.slot-year{margin-top:auto;font-size:.82rem;font-weight:600;color:var(--bronze)}
.slot.filled{border-style:solid;border-color:var(--ink);background:var(--surface)}
.slot.over{background:var(--bronze-wash);border-color:var(--bronze)}
.slot.sel,.card.sel{outline:3px solid var(--bronze);outline-offset:2px}
.slot.ok{border-color:var(--good);background:var(--good-wash)}
.slot.no{border-color:var(--bad);background:var(--bad-wash)}
.slot[disabled]{cursor:default}
.pool{display:flex;flex-wrap:wrap;gap:10px;min-height:68px;padding:10px;border:1.5px dashed var(--line);border-radius:4px;background:var(--paper)}
.card{min-height:46px;padding:10px 14px;border:1.5px solid var(--ink);border-radius:4px;background:var(--surface);font-weight:600;cursor:grab;touch-action:none;-webkit-user-drag:none}
.card.dragging,.slot.dragging{opacity:.35}
.dragghost{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);padding:10px 14px;border:1.5px solid var(--bronze);background:var(--bronze-wash);border-radius:4px;font-weight:600;box-shadow:0 12px 24px -10px rgba(31,43,39,.4)}

/* thử thách 2 */
.match{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px}
.match h3{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);margin-bottom:8px}
.m-col{display:grid;gap:10px;align-content:start;min-width:0}
.m-item{min-height:58px;display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--surface);cursor:pointer;font-weight:600}
.m-item .bd{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--bronze-soft);display:grid;place-items:center;font-size:.85rem;color:var(--bronze);font-weight:700}
.m-item.paired{border-color:var(--ink)}
.m-item.paired .bd{border-style:solid;background:var(--bronze);border-color:var(--bronze);color:#fff}
.m-item.sel{outline:3px solid var(--bronze);outline-offset:2px;background:var(--bronze-wash)}
.m-item.ok{border-color:var(--good);background:var(--good-wash)}
.m-item.no{border-color:var(--bad);background:var(--bad-wash)}
.m-item[disabled]{cursor:default}

/* thử thách 3 */
.passage{font-size:1.14rem;line-height:2.15;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px}
.chip{border:0;border-bottom:2px dotted var(--bronze);background:var(--bronze-wash);padding:2px 8px;border-radius:3px;font-weight:700;cursor:pointer;min-height:36px}
.chip[aria-pressed=true]{background:var(--warn-wash);outline:2px solid var(--warn)}
.chip.ok{background:var(--good-wash);outline:2px solid var(--good)}
.chip.no{background:var(--bad-wash);outline:2px solid var(--bad);text-decoration:line-through}
.chip.miss{background:var(--bad-wash);outline:2px dashed var(--bad)}
.chip[disabled]{cursor:default}
.fx{font-weight:700;color:var(--good);margin-left:6px;white-space:nowrap}
.fx.miss{color:var(--bad)}
.fixes{display:grid;gap:10px}
.fix{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--paper)}
.fix span{flex:1 1 200px;min-width:0}
.fix select{min-height:42px;padding:6px 10px;border:1.5px solid var(--ink-2);border-radius:4px;background:#fff;min-width:170px;max-width:100%}

/* thử thách 4 */
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--surface);cursor:pointer;line-height:1.45}
.opt .bx{flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;font-size:.95rem;font-weight:800;color:transparent;margin-top:1px}
.opt[aria-checked=true]{border-color:var(--ink);background:var(--bronze-wash)}
.opt[aria-checked=true] .bx{background:var(--ink);color:var(--paper)}
.opt.ok{border-color:var(--good);background:var(--good-wash)}
.opt.ok .bx{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-wash)}
.opt.no .bx{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.miss{border-style:dashed;border-color:var(--good)}
.opt[disabled]{cursor:default}

/* phản hồi */
.fb{padding:20px 22px;display:grid;gap:12px;scroll-margin-top:150px}
.fb-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:4px}
.fb-head strong{font-family:var(--display);font-size:1.25rem}
.fb-head.good{background:var(--good-wash);color:var(--good)}
.fb-head.mid{background:var(--warn-wash);color:var(--warn)}
.fb-head.bad{background:var(--bad-wash);color:var(--bad)}
.fb-pts{font-weight:700;font-variant-numeric:tabular-nums}
.fb-list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.fb-list li{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:4px}
.fb-list li p{color:var(--ink-2);font-size:.95rem;margin-top:2px}
.fb-list .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;color:#fff;margin-top:1px}
.fb-list li.ok .ic{background:var(--good)}
.fb-list li.no .ic{background:var(--bad)}
.fb-list li.ok{border-color:#B7D6C5}
.fb-list li.no{border-color:#E6BDB8}

/* kết quả */
.result{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:20px;align-items:start}
.hero{padding:26px;display:grid;gap:10px;position:relative}
.big{font-family:var(--display);font-weight:800;font-size:clamp(3.6rem,10vw,6.2rem);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.3em;color:var(--ink-2);font-weight:600}
.rank{font-family:var(--display);font-size:1.5rem;font-weight:700}
.codebox{display:flex;gap:8px;flex-wrap:wrap}
.codebox input{flex:1 1 220px;min-width:0;min-height:42px;padding:6px 10px;border:1.5px solid var(--ink-2);border-radius:4px;background:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.box{padding:20px 22px;display:grid;gap:12px;min-width:0}
.box h2{font-family:var(--display);font-size:1.25rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.me td{background:var(--bronze-wash);font-weight:600}
.row-actions{display:flex;gap:10px;flex-wrap:wrap}
.review{display:grid;gap:6px}
.review p{font-size:.95rem;color:var(--ink-2)}

/* chân trang, hộp thoại, thông báo, chuyển cảnh */
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.tv{display:grid;gap:18px}
.tv-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap}
.tv-head h2{font-family:var(--display);font-size:clamp(1.5rem,3vw,2.1rem)}
.tv-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tv select{min-height:42px;padding:6px 10px;border:1.5px solid var(--ink-2);border-radius:4px;background:var(--surface);max-width:100%}
.tv-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:20px;align-items:start}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:var(--paper-2);color:var(--ink-2)}
.pill.live{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.pill.warn{background:var(--warn-wash);border-color:var(--warn);color:var(--warn)}
.qrank{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.qrank li{display:grid;gap:5px;min-width:0}
.qrank .top{display:flex;justify-content:space-between;gap:6px 14px;align-items:baseline;flex-wrap:wrap}
.qrank .meter{display:block;height:8px;border-radius:4px;background:var(--paper-2);overflow:hidden}
.qrank .meter i{display:block;height:100%;background:var(--bad)}
.teams{display:grid;gap:12px}
.tm{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--surface);display:grid;gap:8px;min-width:0}
.tm-head{display:flex;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
.tm-head strong{font-family:var(--display);font-size:1.1rem;overflow-wrap:anywhere}
.tm ul{margin:0;padding-left:1.1rem;display:grid;gap:4px;font-size:.93rem}
.tm .mine{color:var(--ink-2)}
.cast{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0 0;padding:0}
.cast figure{margin:0;display:grid;gap:6px;justify-items:center;align-content:end;min-width:0}
.cast img{width:100%;height:clamp(96px,16vw,150px);object-fit:contain;filter:drop-shadow(0 6px 8px rgba(31,43,39,.18))}
.cast figcaption{font-size:.78rem;font-weight:600;color:var(--ink-2);text-align:center;line-height:1.25;min-height:2.5em}
.cast.sm{margin-top:6px;gap:8px}
.cast.sm img{height:clamp(56px,9vw,84px)}
.cast.sm figcaption{font-size:.72rem}
.th{height:44px;width:auto;max-width:56px;object-fit:contain;flex:none;pointer-events:none}
.th.lg{height:40px}
.card{display:flex;align-items:center;gap:10px}
.slot-fig{display:flex;align-items:center;gap:8px;min-width:0}
.m-item .th{height:38px;max-width:48px}
.tsec{display:grid;gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.tsec h3{font-size:1rem}
.tsec textarea{width:100%;min-height:110px;padding:10px;border:1.5px solid var(--ink-2);border-radius:4px;background:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.tsec input[type=text],.tsec input[type=password]{min-height:44px;padding:8px 12px;border:1.5px solid var(--ink-2);border-radius:4px;background:#fff;max-width:100%}
details pre{overflow-x:auto;background:var(--paper);border:1px solid var(--line);padding:10px;border-radius:4px;font-size:.8rem}
details summary{cursor:pointer;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:80;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.curtain{position:fixed;inset:0;z-index:60;visibility:hidden;pointer-events:none}
.curtain.on{visibility:visible;pointer-events:auto}
.curtain .half{position:absolute;top:0;bottom:0;width:50.5%;background:var(--paper-2);transition:transform .32s cubic-bezier(.7,0,.3,1)}
.curtain .l{left:0;transform:translateX(-101%);border-right:3px solid var(--bronze-soft)}
.curtain .r{right:0;transform:translateX(101%);border-left:3px solid var(--bronze-soft)}
.curtain.on .half{transform:none}
.curtain .cl{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:8px;padding:16px;opacity:0;transition:opacity .2s .18s}
.curtain.on .cl{opacity:1}
.cl b{font-family:var(--display);font-size:clamp(1.8rem,5vw,3rem);letter-spacing:.06em}
.cl span{color:var(--ink-2);font-size:1.1rem}

@media (max-width:959px){
  .home,.play,.result,.tv-grid{grid-template-columns:minmax(0,1fr)}

<!-- ============================================================
  PHẦN 2. QUY TẮC CHẤM ĐIỂM VÀ MÃ KẾT QUẢ (hàm thuần, có thể kiểm thử)
  ============================================================ -->
<script id="rules">
const Rules = (() => {
  const A = () => CONFIG.pointsAccuracyMax;
  const pts = (right, total) => Math.round(A() * right / total);
  const clamp = (n, lo, hi) => Math.max(lo, Math.min(hi, n));

  function c1(slots, correct) {
    let right = 0;
    correct.forEach((id, i) => { if (slots[i] === id) right++; });
    return { right, total: correct.length, points: pts(right, correct.length) };
  }
  function c2(pairs, ids) {
    let right = 0;
    ids.forEach(id => { if (pairs[id] === id) right++; });
    return { right, total: ids.length, points: pts(right, ids.length) };
  }
  // Mỗi lỗi gồm 2 phần: phát hiện và sửa đúng. Đánh dấu nhầm mốc đúng bị trừ 3 điểm.
  function c3(flagged, fixes, chips) {
    const errs = chips.filter(c => c.correct !== c.text);
    let found = 0, fixed = 0, falseFlags = 0;
    chips.forEach(c => {
      const isErr = c.correct !== c.text;
      const fl = flagged.includes(c.id);
      if (isErr && fl) { found++; if (fixes[c.id] === c.correct) fixed++; }
      if (!isErr && fl) falseFlags++;
    });
    const unit = A() / (errs.length * 2);
    const points = clamp(Math.round((found + fixed) * unit - falseFlags * 3), 0, A());
    return { found, fixed, falseFlags, totalErrors: errs.length, points };
  }
  function c4(chosen, options) {
    const need = options.filter(o => o.correct).length;
    let hit = 0;
    options.forEach(o => { if (o.correct && chosen.includes(o.id)) hit++; });
    const wrong = chosen.length - hit;
    return { hit, wrong, total: need, points: pts(hit, need) };
  }
  function timeBonus(accuracyPoints, remaining) {
    if (accuracyPoints < A()) return 0;
    const r = clamp(remaining, 0, CONFIG.secondsPerChallenge);
    return Math.round(CONFIG.pointsTimeBonusMax * r / CONFIG.secondsPerChallenge);
  }
  const maxTotal = () => 4 * (A() + CONFIG.pointsTimeBonusMax);
  function rank(total) {
    const pct = total / maxTotal() * 100;
    return CONFIG.rankTitles.slice().sort((a, b) => b.min - a.min).find(r => pct >= r.min) || CONFIG.rankTitles[CONFIG.rankTitles.length - 1];
  }
  function checksum(str) {
    let h = 5381;
    const s = str + CONFIG.codeSalt;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return h.toString(36).toUpperCase().slice(-5);
  }
  const cleanTeam = t => String(t).replace(/[|\r\n]/g, " ").replace(/\s+/g, " ").trim().slice(0, CONFIG.teamNameMaxLength);
  const cleanRoom = r => String(r || "").toUpperCase().replace(/[^A-Z0-9_-]/g, "").slice(0, CONFIG.roomMaxLength) || CONFIG.defaultRoom;
  // Danh mục các ý có thể làm sai, lấy từ CONTENT. Khóa của mỗi ý là "số mật lệnh:mã ý".
  // mask=false: ý "đánh dấu nhầm mốc đúng", chỉ ghi nhận khi gửi trực tuyến, không nằm trong mã dự phòng.
  function catalog() {
    const U = Object.fromEntries(CONTENT.uprisings.map(u => [u.id, u]));
    const list = [];
    CONTENT.c1.correctOrder.forEach(id => list.push({ c: 1, k: id, mask: true, label: `Xếp trình tự: ${U[id].yearLabel}, ${U[id].name}` }));
    CONTENT.c2.pairs.forEach(p => list.push({ c: 2, k: p.id, mask: true, label: `Nối ${p.left} với ${p.right}` }));
    CONTENT.c3.segments.filter(s => typeof s !== "string").forEach(s => {
      if (s.correct !== s.text) list.push({ c: 3, k: s.id, mask: true, label: `Sửa “${s.text}” thành “${s.correct}” (${s.context})` });
      else list.push({ c: 3, k: "fp:" + s.id, mask: false, label: `Đánh dấu nhầm mốc đúng “${s.text}” (${s.context})` });
    });
    CONTENT.c4.options.forEach(o => list.push({ c: 4, k: o.id, mask: true, label: o.label }));
    return list;
  }
  const maskItems = () => catalog().filter(i => i.mask);
  function encodeMask(wrongKeys) {
    const set = new Set(wrongKeys);
    const bits = maskItems().map(i => set.has(i.c + ":" + i.k) ? "1" : "0").join("");
    return parseInt("1" + bits, 2).toString(36);
  }
  function decodeMask(s) {
    const n = parseInt(s, 36);
    if (!Number.isFinite(n) || n < 1) return null;
    const bits = n.toString(2).slice(1), items = maskItems();
    if (bits.length !== items.length) return null;
    return items.filter((_, i) => bits[i] === "1").map(i => i.c + ":" + i.k);
  }
  // Mã kết quả dự phòng: tên đội, lớp, điểm từng mật lệnh, tổng, giây, các ý sai (nén), mã kiểm tra.
  function makeCode(team, room, parts, total, used, wrongKeys) {
    const body = [cleanTeam(team), cleanRoom(room), parts.join(","), total, used, encodeMask(wrongKeys)].join("|");
    return `MLHK2|${body}|${checksum(body)}`;
  }
  function parseCode(line) {
    const p = String(line).trim().split("|");
    if (p.length !== 8 || p[0] !== "MLHK2") return null;
    if (checksum(p.slice(1, 7).join("|")) !== p[7]) return null;
    const parts = p[3].split(",").map(Number), total = Number(p[4]), used = Number(p[5]);
    if (parts.length !== 4 || parts.some(n => !Number.isFinite(n)) || !Number.isFinite(total) || !Number.isFinite(used)) return null;
    if (parts.reduce((a, b) => a + b, 0) !== total) return null;
    const wrong = decodeMask(p[6]);
    if (!wrong) return null;
    return { team: p[1], room: p[2], parts, total, used, wrong };
  }
  return { c1, c2, c3, c4, timeBonus, maxTotal, rank, checksum, cleanTeam, cleanRoom, catalog, makeCode, parseCode };
})();
</script>

  function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

      readonly: 'Tài khoản này chưa có quyền gửi kết quả. Hãy gửi mã kết quả cho giáo viên ở cuối trò chơi.',
      off: 'Chưa kết nối kho dữ liệu chung. Vẫn chơi bình thường; cuối trò chơi hãy gửi mã kết quả cho giáo viên.'
    };
    const set = s => { st.state = s; st.subs.forEach(f => { try { f(); } catch (e) {} }); };
    const SBC = CLOUD.supabase || {};
    const SB = SBC.url && SBC.key ? { base: String(SBC.url).replace(/\/+$/, '') + '/rest/v1/' + (SBC.table || 'plays'), key: SBC.key, poll: Math.max(2000, Number(SBC.pollMs) || 4000) } : null;
    const sbHead = extra => Object.assign({ apikey: SB.key }, /^eyJ/.test(SB.key) ? { Authorization: 'Bearer ' + SB.key } : {}, extra || {});
    async function sbGet(q) {
      const r = await fetch(SB.base + '?' + q, { headers: sbHead(), cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }
    async function sbPost(row) {
      const r = await fetch(SB.base, { method: 'POST', headers: sbHead({ 'Content-Type': 'application/json', Prefer: 'return=minimal' }), body: JSON.stringify(row) });
      if (!r.ok) throw new Error('HTTP ' + r.status);

        if (!window.claude || typeof window.claude.use !== 'function') return set('off');

        if (!db || !user) return set('off');
        const uid = await user.id();
        if (!uid) return set('off');

        const cw = await user.can('data.write');

    })();
    const ready = (async () => {
      await readyDb;
      if (!SB) return;
      try { await sbGet('select=play_id&limit=1'); st.sb = true; st.sbErr = ''; set('ok'); }
      catch (e) { st.sb = false; st.sbErr = String(e && e.message || e); }

    let chain = Promise.resolve();
    function push(play) {
      chain = chain.then(async () => {

        try {
          const ref = st.db.doc(CLOUD.collection + '/' + st.uid);
          if (!st.loaded) {

            const d = snap.exists ? snap.data() : null;

      push,
      text: () => TEXT[st.state] || TEXT.off,
      homeText: () => TEXT[st.state === 'sent' ? 'ok' : st.state] || TEXT.off,
      onChange: f => st.subs.push(f),

  /* ---------- thử thách 1: kéo thả niên đại ---------- */
  function buildC1(def) {
    const byId = Object.fromEntries(CONTENT.uprisings.map(u => [u.id, u]));
    let order = def.correctOrder.slice();
    do { order = shuffle(order); } while (order.every((id, i) => id === def.correctOrder[i]));
    const slots = [null, null, null, null];
    let sel = null, locked = false, justDragged = false;
    const tl = h('div', { class: 'timeline' });
    const pool = h('div', { class: 'pool' });
    const el = h('div', { class: 'c1', style: 'display:grid;gap:12px' },
      h('div', { class: 'axis' }, h('span', { text: 'Sớm nhất' }), h('span', { class: 'axis-line' }), h('span', { text: 'Muộn nhất' })),
      tl, h('p', { class: 'lbl', text: 'Kho thẻ' }), pool,
      h('p', { class: 'hint', text: 'Kéo thẻ thả vào ô, hoặc chạm thẻ rồi chạm ô. Chạm thẻ đã đặt rồi chạm vào kho thẻ để gỡ.' }));

    function place(id, to) {
      const from = slots.indexOf(id), occ = slots[to];
      slots[to] = id;
      if (from >= 0) slots[from] = occ;
    }
    function paint(marks) {
      tl.replaceChildren(...slots.map((id, i) => {
        const cls = 'slot' + (id ? ' filled' : '') + (sel && sel === id ? ' sel' : '') + (marks ? (marks[i] ? ' ok' : ' no') : '');
        const b = h('button', { type: 'button', class: cls, 'data-slot': String(i), disabled: locked, 'aria-label': `Vị trí ${i + 1}: ${id ? byId[id].name : 'trống'}` },
          h('span', { class: 'idx', text: String(i + 1) }),
          id ? h('span', { class: 'slot-fig' }, art(id, 'th'), h('span', { class: 'slot-name', text: byId[id].name })) : h('span', { class: 'slot-empty', text: locked ? 'Chưa đặt thẻ' : 'Thả thẻ vào đây' }),
          locked ? h('span', { class: 'slot-year', text: id ? byId[id].yearLabel : '' }) : null);
        b.addEventListener('click', () => onSlot(i));
        if (id) b.addEventListener('pointerdown', e => beginDrag(e, id));
        return b;
      }));
      const free = order.filter(id => !slots.includes(id));
      pool.replaceChildren(...free.map(id => {
        const c = h('button', { type: 'button', class: 'card' + (sel === id ? ' sel' : ''), disabled: locked },
          art(id, 'th'), byId[id].name + (CONFIG.showYearOnCardInChallenge1 ? ` (${byId[id].yearLabel})` : ''));
        c.addEventListener('click', () => onCard(id));
        c.addEventListener('pointerdown', e => beginDrag(e, id));

      }));
      if (!free.length) pool.append(h('span', { class: 'slot-empty', text: 'Đã đặt đủ bốn thẻ' }));
    }
    function onCard(id) { if (locked || justDragged) return; sel = sel === id ? null : id; paint(); }
    function onSlot(i) {
      if (locked || justDragged) return;
      if (sel) { place(sel, i); sel = null; paint(); }
      else if (slots[i]) { sel = slots[i]; paint(); }

    }
    pool.addEventListener('click', e => {
      if (locked || justDragged || e.target.closest('.card')) return;

    });
    function slotAt(x, y) { const t = document.elementFromPoint(x, y); const s = t && t.closest('.slot'); return s && tl.contains(s) ? s : null; }
    function beginDrag(e, id) {
      if (locked || e.button > 0) return;
      const src = e.currentTarget, sx = e.clientX, sy = e.clientY, pid = e.pointerId;
      let ghost = null, over = null, moved = false;

        if (!moved && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
          moved = true; ghost = h('div', { class: 'dragghost', text: byId[id].name }); document.body.append(ghost); src.classList.add('dragging');
        }
        if (moved) {
          ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
          const s = slotAt(ev.clientX, ev.clientY);
          if (over !== s) { if (over) over.classList.remove('over'); over = s; if (over) over.classList.add('over'); }
        }
      };
      const end = ev => {
        if (ev.pointerId !== pid) return;

          return { key: id, ok, mine: ok ? '' : (at < 0 ? 'chưa đặt thẻ' : `đặt ở vị trí ${at + 1}`), title: `${i + 1}. ${byId[id].yearLabel}: ${byId[id].name}`, text: def.explain[id] + (ok ? '' : (at < 0 ? ' Đội chưa đặt thẻ này.' : ` Đội đặt ở vị trí ${at + 1}.`)) };

  /* ---------- thử thách 2: nối cặp ---------- */
  function buildC2(def) {
    const pairs = {}, num = {};
    const L = def.pairs.map(p => ({ id: p.id, label: p.left }));
    let R = def.pairs.map(p => ({ id: p.id, label: p.right }));
    do { R = shuffle(R); } while (R.every((r, i) => r.id === L[i].id));
    let sel = null, locked = false, marks = null;
    const colL = h('div', { class: 'm-col' }), colR = h('div', { class: 'm-col' });
    const el = h('div', { style: 'display:grid;gap:12px' },
      h('div', { class: 'match' }, h('div', {}, h('h3', { text: 'Cuộc khởi nghĩa' }), colL), h('div', {}, h('h3', { text: 'Triều đại đô hộ' }), colR)),
      h('p', { class: 'hint', text: 'Số trên mỗi ô cho biết hai ô đang được ghép với nhau.' }));
    const rightPaired = id => Object.keys(pairs).find(k => pairs[k] === id);
    function link(l, r) {

    }
    function unpair(side, id) { const l = side === 'L' ? id : rightPaired(id); if (l) { delete pairs[l]; delete num[l]; } }
    function click(side, id) {
      if (locked) return;
      const paired = side === 'L' ? pairs[id] !== undefined : !!rightPaired(id);
      if (paired) { unpair(side, id); sel = { side, id }; paint(); return; }
      if (sel && sel.side !== side) { side === 'L' ? link(id, sel.id) : link(sel.id, id); sel = null; paint(); return; }
      sel = sel && sel.side === side && sel.id === id ? null : { side, id }; paint();
    }
    function item(side, o) {
      const l = side === 'L' ? o.id : rightPaired(o.id);
      const paired = l !== undefined && l !== null && pairs[l] !== undefined;
      const mk = marks && (side === 'L' ? marks[o.id] : marks[rightPaired(o.id)]);
      const cls = 'm-item' + (paired ? ' paired' : '') + (sel && sel.side === side && sel.id === o.id ? ' sel' : '') + (marks ? (paired ? (mk ? ' ok' : ' no') : ' no') : '');
      const b = h('button', { type: 'button', class: cls, disabled: locked }, h('span', { class: 'bd', text: paired ? String(num[l]) : '' }), side === 'L' ? art(o.id, 'th') : null, h('span', { text: o.label }));
      b.addEventListener('click', () => click(side, o.id));
      return b;
    }
    function paint() { colL.replaceChildren(...L.map(o => item('L', o))); colR.replaceChildren(...R.map(o => item('R', o))); }
    paint();
    const rl = id => (def.pairs.find(p => p.id === id) || {}).right;
    return {
      el,
      evaluate() {
        const r = Rules.c2(pairs, def.pairs.map(p => p.id));
        const items = def.pairs.map(p => {
          const ok = pairs[p.id] === p.id;
          return { key: p.id, ok, mine: ok ? '' : (pairs[p.id] === undefined ? 'chưa ghép cặp' : `ghép với ${rl(pairs[p.id])}`), title: `${p.left} và ${p.right}`, text: p.explain + (ok ? '' : (pairs[p.id] === undefined ? ' Đội chưa ghép cặp này.' : ` Đội đã ghép với ${rl(pairs[p.id])}.`)) };
        });
        return { points: r.points, summary: `${r.right}/${r.total} cặp đúng`, items };
      },
      reveal() { locked = true; sel = null; marks = {}; def.pairs.forEach(p => { marks[p.id] = pairs[p.id] === p.id; }); paint(); }
    };
  }

  /* ---------- thử thách 3: phát hiện và sửa lỗi ---------- */
  function buildC3(def) {
    const chips = def.segments.filter(s => typeof s !== 'string');
    const flagged = [], fixes = {};
    let locked = false, ev = null;
    const passage = h('p', { class: 'passage' });
    const fixBox = h('div', { class: 'fixes', 'aria-live': 'polite' });
    const el = h('div', { style: 'display:grid;gap:14px' }, passage, h('p', { class: 'lbl', text: 'Mốc đã đánh dấu' }), fixBox);
    function toggle(c) {
      if (locked) return;
      const i = flagged.indexOf(c.id);
      if (i >= 0) { flagged.splice(i, 1); delete fixes[c.id]; } else flagged.push(c.id);
      paint();
    }
    function chipEl(c) {
      const fl = flagged.includes(c.id), isErr = c.correct !== c.text;
      let cls = 'chip', extra = null;
      if (locked) {
        if (isErr && fl && fixes[c.id] === c.correct) { cls += ' ok'; extra = h('span', { class: 'fx', text: '→ ' + c.correct }); }
        else if (isErr && fl) { cls += ' no'; extra = h('span', { class: 'fx miss', text: '→ ' + c.correct }); }
        else if (isErr) { cls += ' miss'; extra = h('span', { class: 'fx miss', text: '→ ' + c.correct }); }
        else if (fl) cls += ' no';
      }
      const b = h('button', { type: 'button', class: cls, 'aria-pressed': fl ? 'true' : 'false', disabled: locked, text: c.text });
      b.addEventListener('click', () => toggle(c));
      return extra ? [b, extra] : b;
    }
    function paint() {
      passage.replaceChildren(...def.segments.flatMap(s => typeof s === 'string' ? [s] : [].concat(chipEl(s))));
      const rows = flagged.map(id => chips.find(c => c.id === id)).map(c => {
        const sl = h('select', { id: 'fix-' + c.id, 'aria-label': `Niên đại đúng thay cho ${c.text} (${c.context})`, disabled: locked },
          h('option', { value: '', text: 'Chọn niên đại đúng' }),
          def.fixOptions.map(o => h('option', { value: o, text: o, selected: fixes[c.id] === o })));
        sl.addEventListener('change', () => { fixes[c.id] = sl.value || undefined; if (!sl.value) delete fixes[c.id]; });
        return h('div', { class: 'fix' }, h('span', {}, `Mốc “${c.text}” trong câu về ${c.context}, sửa thành:`), sl);
      });
      fixBox.replaceChildren(...(rows.length ? rows : [h('p', { class: 'hint', text: 'Chưa đánh dấu mốc nào. Chạm vào mốc in đậm trong đoạn mật lệnh.' })]));
    }
    paint();
    return {
      el,
      evaluate() {
        const r = Rules.c3(flagged, fixes, chips);
        const items = [];
        chips.filter(c => c.correct !== c.text).forEach(c => {
          const fl = flagged.includes(c.id), fx = fixes[c.id] === c.correct;
          let note = !fl ? ' Đội chưa phát hiện lỗi này.' : (fx ? '' : (fixes[c.id] ? ` Đội đã phát hiện lỗi nhưng sửa thành “${fixes[c.id]}”.` : ' Đội đã phát hiện lỗi nhưng chưa chọn niên đại sửa.'));
          items.push({ key: c.id, ok: fl && fx, mine: !fl ? 'chưa phát hiện lỗi' : (fx ? '' : (fixes[c.id] ? `sửa thành “${fixes[c.id]}”` : 'chưa chọn niên đại sửa')), title: `“${c.text}” phải sửa thành “${c.correct}”`, text: c.why + note });
        });
        chips.filter(c => c.correct === c.text && flagged.includes(c.id)).forEach(c => items.push({ key: 'fp:' + c.id, ok: false, mine: '', title: `“${c.text}” là mốc đúng`, text: c.why + ' Đội đã đánh dấu nhầm mốc này (bị trừ điểm).' }));
        return { points: r.points, summary: `Phát hiện ${r.found}/${r.totalErrors} lỗi, sửa đúng ${r.fixed}/${r.totalErrors}${r.falseFlags ? `, đánh dấu nhầm ${r.falseFlags} mốc` : ''}`, items };
      },
      reveal() { locked = true; paint(); }
    };
  }

  /* ---------- thử thách 4: chọn hai nhận định đúng ---------- */
  function buildC4(def) {

  /* ---------- màn hình giáo viên: xem các đội đã sai câu nào ---------- */
  const T = { plays: [], manual: [], room: '', unsub: null, gen: 0, status: 'checking', canEdit: false, els: {}, csv: '' };

  function cleanupTeacher() {
    T.gen++;
    if (T.unsub) { try { T.unsub(); } catch (e) {} T.unsub = null; }
    T.els = {};
  }
  // Dữ liệu từ máy chủ là dữ liệu do học sinh ghi: ép kiểu và cắt độ dài trước khi hiển thị.
  function normPlay(p, dev) {
    if (!p || typeof p !== 'object') return null;
    const w = Array.isArray(p.w) ? p.w.filter(x => x && typeof x === 'object').map(x => ({ c: Number(x.c) || 0, k: String(x.k || ''), t: clip(x.t, 120), m: clip(x.m, 80) })) : [];
    const step = Math.max(0, Math.min(4, Number(p.step) || 0));
    return { id: String(p.id || dev), dev, team: clip(p.team || 'Đội chưa đặt tên', 40), room: Rules.cleanRoom(p.room), upd: Number(p.upd) || 0, step, done: !!p.done || step >= 4, total: Number(p.total) || 0, used: Number(p.used) || 0, w };
  }
  function manualPlays() {
    return T.manual.map((m, i) => {
      const p = Rules.parseCode(m.code); if (!p) return null;
      return { id: 'm' + i, dev: 'code', team: clip(p.team, 40), room: Rules.cleanRoom(p.room), upd: Number(m.at) || 0, step: 4, done: true, total: p.total, used: p.used,
        w: p.wrong.map(s => { const j = s.indexOf(':'); return { c: Number(s.slice(0, j)), k: s.slice(j + 1), t: '', m: '' }; }) };
    }).filter(Boolean);
  }
  function paintTeacher() {
    const E = T.els; if (!E.root || S.screen !== 'teacher') return;
    const cat = Rules.catalog(), label = {};
    cat.forEach(it => { label[it.c + ':' + it.k] = it.label; });
    // Mã nhập tay trùng với lượt đã có trên máy chủ (cùng đội, lớp, điểm) thì bỏ qua để không đếm hai lần.
    const all = T.plays.concat(manualPlays().filter(m => !T.plays.some(p => p.done && p.team === m.team && p.room === m.room && p.total === m.total)));
    const rooms = [...new Set(all.map(p => p.room))].sort();
    if (T.room && !rooms.includes(T.room)) T.room = '';
    E.room.replaceChildren(h('option', { value: '', text: 'Tất cả lớp' }), ...rooms.map(r => h('option', { value: r, text: 'Lớp ' + r })));
    E.room.value = T.room;
    const list = all.filter(p => !T.room || p.room === T.room).sort((a, b) => b.upd - a.upd);

    const pill = { checking: ['Đang kết nối...', ''], live: ['Trực tiếp từ máy chủ', ' live'], off: ['Chưa kết nối máy chủ, chỉ nhận mã kết quả', ' warn'], error: ['Mất kết nối máy chủ', ' warn'] }[T.status];
    E.pill.textContent = pill[0]; E.pill.className = 'pill' + pill[1];
    const sbe = Cloud.sbError(); if (sbe && T.status !== 'live') E.pill.textContent += ' (Supabase: ' + sbe + ')';

    const finished = list.filter(p => p.done);
    const avg = finished.length ? Math.round(finished.reduce((a, p) => a + p.total, 0) / finished.length) : 0;
    E.sum.textContent = list.length
      ? `${list.length} lượt chơi, ${finished.length} đã hoàn thành${finished.length ? `, điểm trung bình ${avg}/${Rules.maxTotal()}` : ''}.`
      : 'Chưa có lượt chơi nào.';

    const rank = cat.map(it => {
      const n = list.filter(p => p.step >= it.c).length;
      const wr = list.filter(p => p.w.some(x => x.c === it.c && x.k === it.k)).length;
      return { it, n, wr };
    }).filter(x => x.wr > 0 && x.n > 0).sort((a, b) => b.wr / b.n - a.wr / a.n || b.wr - a.wr);
    E.rank.replaceChildren(...(rank.length
      ? rank.map(x => h('li', {},
          h('div', { class: 'top' }, h('span', {}, h('b', { text: `Mật lệnh ${x.it.c}. ` }), x.it.label), h('span', { class: 'fb-pts', text: `${x.wr}/${x.n} đội sai` })),
          h('span', { class: 'meter' }, h('i', { style: `width:${Math.round(100 * x.wr / x.n)}%` }))))
      : [h('li', { class: 'hint', text: list.length ? 'Chưa có ý nào bị sai.' : 'Thống kê sẽ hiện khi có đội nộp mật lệnh.' })]));

    E.teams.replaceChildren(...(list.length ? list.map(p => {
      const wl = p.w.slice().sort((a, b) => a.c - b.c);
      const body = p.step === 0 ? h('p', { class: 'hint', text: 'Chưa nộp mật lệnh nào.' })
        : wl.length ? h('ul', {}, wl.map(x => h('li', {}, h('b', { text: `Mật lệnh ${x.c}: ` }), label[x.c + ':' + x.k] || x.t || x.k, x.m ? h('span', { class: 'mine', text: ` · Đội: ${x.m}` }) : null)))
        : h('p', { class: 'hint', text: p.done ? 'Không sai ý nào.' : 'Chưa sai ý nào cho đến lúc này.' });
      return h('article', { class: 'tm' },
        h('div', { class: 'tm-head' }, h('strong', { text: p.team }),
          h('span', {}, h('span', { class: 'pill', text: 'Lớp ' + p.room }), ' ', h('span', { class: 'pill' + (p.done ? ' live' : ' warn'), text: p.done ? 'Hoàn thành' : `Đang chơi, xong ${p.step}/4` })),
          h('span', { class: 'score', text: `${p.total}/${Rules.maxTotal()} điểm · ${p.used} giây` })),
        body);
    }) : [h('p', { class: 'hint', text: 'Chưa có đội nào. Hãy cho học sinh vào cùng đường dẫn và nhập đúng mã lớp.' })]));

    const rows = [['Lớp', 'Đội', 'Trạng thái', 'Điểm', 'Giây', 'Các ý sai']].concat(list.map(p => [p.room, p.team, p.done ? 'Hoàn thành' : `Đang chơi ${p.step}/4`, p.total, p.used,
      p.w.map(x => `MĐ${x.c}: ${label[x.c + ':' + x.k] || x.t || x.k}`).join('; ')]));
    T.csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    E.csv.value = T.csv;
  }
  function buildAdminTools() {
    const E = T.els; if (!E.tools) return;
    const tools = [];
    if (T.canEdit) tools.push(armed(h('button', { type: 'button', class: 'btn ghost', text: 'Xóa toàn bộ kết quả trên máy chủ' }), 'Xóa toàn bộ kết quả trên máy chủ', async () => {
      try { const n = await Cloud.wipe(); toast(`Đã xóa dữ liệu của ${n} thiết bị.`); } catch (e) { toast('Không xóa được dữ liệu trên máy chủ.'); }
    }));
    tools.push(armed(h('button', { type: 'button', class: 'btn ghost', text: 'Xóa mã đã nhập tay' }), 'Xóa mã đã nhập tay', async () => { T.manual = []; Store.set(CONFIG.storageKeys.manual, []); paintTeacher(); toast('Đã xóa các mã nhập tay.'); }));
    tools.push(armed(h('button', { type: 'button', class: 'btn ghost', text: 'Xóa bảng điểm trên thiết bị này' }), 'Xóa bảng điểm trên thiết bị này', async () => { Store.set(CONFIG.storageKeys.scores, []); toast('Đã xóa bảng điểm trên thiết bị này.'); }));
    if (Cloud.mode() === 'sb') tools.unshift(h('p', { class: 'fine', text: 'Kết quả được lưu trên Supabase. Muốn xóa dữ liệu cũ, vào Supabase, mở SQL Editor và chạy: delete from plays;' }));
    E.tools.replaceChildren(...tools);
  }
  async function viewTeacher() {
    stopTimer(); cleanupTeacher();
    const gen = T.gen;
    S.screen = 'teacher';
    T.manual = Store.get(CONFIG.storageKeys.manual, []); T.plays = []; T.room = ''; T.status = 'checking'; T.canEdit = false;
    renderTopbar();
    const E = T.els;
    E.room = h('select', { id: 'troom', 'aria-label': 'Chọn lớp' });
    E.room.addEventListener('change', () => { T.room = E.room.value; paintTeacher(); });
    E.pill = h('span', { class: 'pill', text: 'Đang kết nối...' });
    E.sum = h('p', { class: 'hint' });
    E.rank = h('ol', { class: 'qrank' });
    E.teams = h('div', { class: 'teams' });
    E.csv = h('textarea', { id: 'csvArea', readonly: true, 'aria-label': 'Dữ liệu CSV', rows: '4' });
    E.codes = h('textarea', { id: 'codes', placeholder: 'Dán mỗi mã kết quả một dòng', 'aria-label': 'Các mã kết quả', rows: '3' });
    E.codeMsg = h('p', { class: 'err', 'aria-live': 'polite' });
    E.tools = h('div', { class: 'row-actions' });
    const addBtn = h('button', { type: 'button', class: 'btn', text: 'Thêm vào bảng theo dõi', onclick: () => {
      const lines = [...new Set(E.codes.value.split('\n').map(s => s.trim()).filter(Boolean))];
      const bad = []; let added = 0;
      lines.forEach((l, i) => {
        if (!Rules.parseCode(l)) { bad.push(i + 1); return; }
        if (!T.manual.some(m => m.code === l)) { T.manual.push({ code: l, at: Date.now() }); added++; }
      });
      Store.set(CONFIG.storageKeys.manual, T.manual);
      E.codeMsg.textContent = bad.length ? `Có ${bad.length} dòng không hợp lệ (dòng ${bad.join(', ')}). Hãy nhờ đội gửi lại mã.` : (added ? `Đã thêm ${added} mã.` : 'Các mã này đã có trong bảng.');
      if (!bad.length) E.codes.value = '';
      paintTeacher();
    } });
    E.root = h('div', { class: 'tv' },
      h('div', { class: 'tv-head' },
        h('div', {}, h('p', { class: 'kicker', text: 'Dành cho giáo viên' }), h('h2', { text: 'Theo dõi lớp học' })),
        h('div', { class: 'tv-tools' }, E.room, E.pill)),
      E.sum,
      h('div', { class: 'tv-grid' },
        h('section', { class: 'placard box' }, h('h2', { text: 'Ý bị sai nhiều nhất' }), E.rank),
        h('section', { class: 'placard box' }, h('h2', { text: 'Từng đội và các ý đã sai' }), E.teams)),
      h('section', { class: 'placard box' }, h('h2', { text: 'Nhập mã kết quả (dự phòng)' }),
        h('p', { class: 'fine', text: 'Dùng khi đội chưa gửi được lên máy chủ. Mã có kiểm tra tổng điểm nhưng không chống làm giả hoàn toàn.' }),
        E.codes, E.codeMsg, h('div', { class: 'row-actions' }, addBtn)),
      h('section', { class: 'placard box' }, h('h2', { text: 'Xuất và dọn dữ liệu' }),
        h('details', {}, h('summary', { text: 'Dữ liệu CSV của lớp đang chọn' }), h('div', { class: 'row-actions', style: 'margin-top:8px' }, h('button', { type: 'button', class: 'btn ghost sm', text: 'Sao chép CSV', onclick: () => copyText(T.csv, E.csv) })), E.csv),
        E.tools));
    $('#view').replaceChildren(E.root);
    window.scrollTo(0, 0);
    paintTeacher(); buildAdminTools();
    Cloud.canEdit().then(v => { if (gen === T.gen) { T.canEdit = v; buildAdminTools(); } });
    const un = await Cloud.watch(docs => {
      if (gen !== T.gen) return;
      T.plays = docs.flatMap(d => (d.data && Array.isArray(d.data.plays) ? d.data.plays : []).map(p => normPlay(p, d.id)).filter(Boolean));
      T.status = 'live'; paintTeacher();
    }, () => { if (gen === T.gen) { T.status = 'error'; paintTeacher(); } });
    if (gen !== T.gen) { if (un) un(); return; }
    if (!un) { T.status = 'off'; paintTeacher(); } else T.unsub = un;
  }

  /* ---------- khởi động ---------- */
  $('#wm').append(drum(560));
  viewHome();
})();
</script>

</body></html>
